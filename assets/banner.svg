<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E"/>
      <stop offset="40%" stop-color="#0B2038"/>
      <stop offset="80%" stop-color="#0D2E5C"/>
      <stop offset="100%" stop-color="#051428"/>
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .bg-grid { stroke: #00F2FE; stroke-opacity: 0.07; stroke-width: 1; }
    .radar-circle { fill: none; stroke: #00F2FE; stroke-opacity: 0.25; stroke-dasharray: 4,4; }
    .radar-line { stroke: #00F2FE; stroke-opacity: 0.2; stroke-width: 1; }
    
    /* Dynamic CSS Animations */
    @keyframes rotateSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseCircle {
      0% { r: 40px; opacity: 0.8; }
      50% { r: 120px; opacity: 0.2; }
      100% { r: 160px; opacity: 0; }
    }

    @keyframes waveMotion {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }

    @keyframes floatIcon {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes beaconGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .radar-sweep-element {
      transform-origin: 1020px 200px;
      animation: rotateSweep 8s linear infinite;
    }

    .pulse-element {
      transform-origin: 1020px 200px;
      animation: pulseCircle 4s ease-out infinite;
    }

    .wave-element {
      animation: waveMotion 10s ease-in-out infinite;
    }

    .float-element {
      animation: floatIcon 4s ease-in-out infinite;
    }

    .beacon {
      animation: beaconGlow 2s infinite ease-in-out;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Nautical Chart Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Dynamic Radar Background Graphic (Right Side) -->
  <g transform="translate(0, 0)">
    <!-- Concentric Radar Rings -->
    <circle cx="1020" cy="200" r="40" class="radar-circle"/>
    <circle cx="1020" cy="200" r="90" class="radar-circle"/>
    <circle cx="1020" cy="200" r="140" class="radar-circle"/>
    <circle cx="1020" cy="200" r="180" class="radar-circle"/>
    <line x1="840" y1="200" x2="1200" y2="200" class="radar-line"/>
    <line x1="1020" y1="20" x2="1020" y2="380" class="radar-line"/>

    <!-- Dynamic Pulsing Ring -->
    <circle cx="1020" cy="200" r="40" fill="none" stroke="#00F2FE" stroke-width="2" class="pulse-element"/>

    <!-- Rotating Radar Sweep Cone -->
    <g class="radar-sweep-element">
      <path d="M 1020 200 L 1200 200 A 180 180 0 0 0 1020 20 Z" fill="url(#radar-sweep)"/>
    </g>

    <!-- Radar Target Blips (Vessels/Assets) -->
    <circle cx="970" cy="140" r="4" fill="#00F2FE" filter="url(#cyan-glow)" class="beacon"/>
    <circle cx="1080" cy="260" r="4" fill="#00E5FF" filter="url(#cyan-glow)" class="beacon" style="animation-delay: 0.7s;"/>
    <circle cx="1040" cy="110" r="3" fill="#4FACFE" filter="url(#cyan-glow)" class="beacon" style="animation-delay: 1.3s;"/>
  </g>

  <!-- Ocean Waves Graphic Layer at Bottom -->
  <g class="wave-element" opacity="0.3">
    <path d="M-100 360 C 150 330, 350 380, 600 350 C 850 320, 1050 370, 1300 350 L 1300 400 L -100 400 Z" fill="#00F2FE" opacity="0.2"/>
    <path d="M-100 370 C 200 390, 450 340, 700 370 C 950 400, 1150 350, 1350 380 L 1350 400 L -100 400 Z" fill="#4FACFE" opacity="0.3"/>
  </g>

  <!-- Main Content Area (Left/Center) -->
  <g transform="translate(80, 0)">
    <!-- Floating Emblem Icon: Ship + Maintenance Gear & Wrench -->
    <g transform="translate(0, 115)" class="float-element">
      <circle cx="45" cy="45" r="45" fill="#0B2545" stroke="#00F2FE" stroke-width="2" filter="url(#cyan-glow)"/>
      
      <!-- Anchor & Gear Motif -->
      <path d="M 45 18 L 45 68 M 27 32 L 63 32 M 25 52 C 25 65, 65 65, 65 52 M 45 18 A 5 5 0 1 0 45 28 A 5 5 0 1 0 45 18" 
            fill="none" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Wrench Overlay -->
      <path d="M 55 25 L 68 12 A 4 4 0 0 1 74 18 L 61 31" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Header Category Badge -->
    <g transform="translate(115, 115)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#0F3460" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1"/>
      <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00F2FE" letter-spacing="1.5">⚓ MARITIME TECHNICAL ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="115" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#text-grad)" filter="url(#cyan-glow)" letter-spacing="-0.5">
      Awesome Ship Maintenance Management
    </text>

    <!-- Subtitle -->
    <text x="115" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#E0F7FA" opacity="0.9" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Fleet Technical Management
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(115, 260)">
      <!-- Pill 1: PMS -->
      <rect x="0" y="0" width="85" height="30" rx="6" fill="#13294B" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
      <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#00F2FE">🛠️ PMS</text>

      <!-- Pill 2: Marine CMMS -->
      <rect x="95" y="0" width="135" height="30" rx="6" fill="#13294B" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
      <text x="107" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#00F2FE">⚙️ Marine CMMS</text>

      <!-- Pill 3: Work Orders -->
      <rect x="240" y="0" width="130" height="30" rx="6" fill="#13294B" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
      <text x="252" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#00F2FE">📋 Work Orders</text>

      <!-- Pill 4: Spares Inventory -->
      <rect x="380" y="0" width="145" height="30" rx="6" fill="#13294B" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
      <text x="392" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#00F2FE">📦 Spare Parts</text>

      <!-- Pill 5: Dry-Docking -->
      <rect x="535" y="0" width="125" height="30" rx="6" fill="#13294B" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
      <text x="547" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#00F2FE">🚢 Dry-Docking</text>
    </g>
  </g>
</svg>
